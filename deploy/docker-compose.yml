# IntelShield trên VPS: intelshield.example.com
#   web     → 127.0.0.1:5000  (Next.js, trang quản lý)
#   backend → 127.0.0.1:5001  (NestJS, /api cho web và app điện thoại)
#   postgres: chỉ trong mạng nội bộ, không mở cổng ra ngoài
# nginx trên máy chủ nhận HTTPS và chuyển vào hai cổng trên (deploy/nginx/intelshield.conf).
# Chạy: cd deploy && docker compose --env-file .env up -d --build
name: intelshield

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_DATABASE}
      TZ: Asia/Ho_Chi_Minh
      PGTZ: Asia/Ho_Chi_Minh
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${DB_USERNAME} -d ${DB_DATABASE}']
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build: ../backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file: .env
    environment:
      NODE_ENV: production
      PORT: 5001
      DB_HOST: postgres
      DB_PORT: 5432
      UPLOAD_DIR: /app/uploads
      TRUST_PROXY: loopback,uniquelocal
    ports:
      - '127.0.0.1:${API_PORT:-5001}:5001'
    volumes:
      - uploads:/app/uploads

  web:
    build:
      context: ../web
      args:
        API_URL: http://backend:5001
        NEXT_PUBLIC_VIDEO_BASE_URL: ${VIDEO_BASE_URL:-}
        NEXT_PUBLIC_APP_DOWNLOAD_URL: ${APP_DOWNLOAD_URL:-}
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - '127.0.0.1:${WEB_PORT:-5000}:5000'

volumes:
  pgdata:
  uploads:
