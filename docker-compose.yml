# Chỉ dùng khi phát triển trên máy. Bản chạy VPS ở deploy/ (Plan 09).
#   Chỉ CSDL (chạy backend/web bằng npm):  docker compose up -d postgres
#   Cả hệ thống trong Docker:              docker compose up -d --build
#     web     → http://localhost:3000
#     backend → http://localhost:3001/api
#     mobile  → http://localhost:5173  (app điện thoại, bản trình duyệt)
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: patrol
      POSTGRES_PASSWORD: patrol
      POSTGRES_DB: patrol
      TZ: Asia/Ho_Chi_Minh
      PGTZ: Asia/Ho_Chi_Minh
    ports:
      - '5433:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U patrol -d patrol']
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build: ./backend
    depends_on:
      postgres:
        condition: service_healthy
    env_file: ./backend/.env
    environment:
      NODE_ENV: production
      PORT: 3001
      DB_HOST: postgres
      DB_PORT: 5432
      UPLOAD_DIR: /app/uploads
      TRUST_PROXY: loopback,uniquelocal
    ports:
      - '3001:3001'
    volumes:
      - uploads:/app/uploads

  web:
    build:
      context: ./web
      args:
        API_URL: http://backend:3001
    depends_on:
      - backend
    environment:
      PORT: 3000
    ports:
      - '3000:3000'

  # App điện thoại chạy trên trình duyệt (mở ở khung điện thoại): http://localhost:5173
  mobile:
    build:
      context: ./mobile
      args:
        VITE_API_BASE: http://localhost:3001/api
    depends_on:
      - backend
    ports:
      - '5173:80'

  # Quay video hướng dẫn theo vai trò → tools/tutorial-videos/out/*.mp4 (dựng lại công ty demo trước khi quay).
  #   docker compose --profile video run --rm video                 (cả 5 vai trò)
  #   docker compose --profile video run --rm video record.mjs bao-ve
  video:
    profiles: ['video']
    build: ./tools/tutorial-videos
    env_file: ./backend/.env # DEMO_RESET_KEY
    depends_on:
      - web
      - mobile
    volumes:
      - ./tools/tutorial-videos:/work
      - /work/node_modules

volumes:
  pgdata:
  uploads:
